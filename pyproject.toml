[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwitracking"
version = "1.2.0"
description = "Corrección por malla, clasificación de ambientes y recomendaciones de manejo para lotes de kiwi, a partir de la serie de KVPI (Sentinel-2) y del clima."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Darío Nicolás Sánchez Leguizamón" }]
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0",
    "numpy>=2.5",
    "scipy>=1.18",
    "shapely>=2.2",
    "pyproj>=3.8",
    "folium>=0.20",
]
keywords = ["kiwi", "agricultura de precisión", "teledetección", "sentinel-2", "KVPI", "horas de frío"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2", "setuptools>=77"]

[project.scripts]
kiwitracking = "kiwitracking.cli:main"

[tool.setuptools]
packages = ["kiwitracking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
