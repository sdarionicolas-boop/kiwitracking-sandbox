[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwitracking"
version = "0.0.1"
description = "Sandbox SDD: corrección por malla, clasificación de ambientes y recomendaciones (KiwiTrackingIA)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "shapely>=2.0",
    "pyproj>=3.6",
    "folium>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["kiwitracking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
